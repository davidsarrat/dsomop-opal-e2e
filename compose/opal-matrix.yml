# Disposable synthetic-data stack; never deploy this harness to a production node.
name: ${STACK:-e2e}
services:
  mongo:
    image: mongo:7.0.16
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${OPAL_ADMIN_PW:?required}
  rock:
    image: obiba/rock:2.3.0-R4.6.1
    container_name: ${STACK:-e2e}-rock
  opal:
    image: obiba/opal:${OPAL_VERSION:?choose 6.1.3 or 5.7.6}
    container_name: ${STACK:-e2e}-opal
    ports: ["127.0.0.1:8880:8080"]
    depends_on: [mongo, rock]
    environment:
      OPAL_ADMINISTRATOR_PASSWORD: ${OPAL_ADMIN_PW:?required}
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_USER: root
      MONGO_PASSWORD: ${OPAL_ADMIN_PW:?required}
      ROCK_HOSTS: rock:8085
