# Builds the dsOMOPClient tutorial site (docs/) from the vendored candidate (pkgs/dsOMOPClient) with the versions
# of the published site: pkgdown 2.2.1 and pandoc 2.9.2.1. The book chapters are committed precomputed Markdown, so
# no connection is opened. The built docs/ goes to a results branch; review it before committing it to the client.
name: dsomop-book-site
on:
  workflow_dispatch:
    inputs:
      articles:
        description: "Article names to rebuild after a complete site build (space-separated); empty = complete site"
        default: ""
permissions:
  contents: write
jobs:
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: r-lib/actions/setup-pandoc@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          pandoc-version: '2.9.2.1'

      - name: R (Posit build, main Ubuntu archive)
        uses: ./.github/actions/fast-r
        timeout-minutes: 10

      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          working-directory: pkgs/dsOMOPClient
          dependencies: '"hard"'
          install-pandoc: false
          install-quarto: false
          extra-packages: |
            pkgdown@2.2.1
            local::.

      - name: Build the site
        shell: bash
        run: |
          set -o pipefail
          cd pkgs/dsOMOPClient
          Rscript -e 'cat("pkgdown", as.character(packageVersion("pkgdown")), "pandoc", as.character(rmarkdown::pandoc_version()), "\n")'
          Rscript ../../scripts/book-site.R ${{ inputs.articles }} 2>&1 | tee ../../book-site.log

      - name: Site to a branch
        if: always()
        shell: bash
        run: |
          mkdir -p out
          [ -d pkgs/dsOMOPClient/docs ] && cp -r pkgs/dsOMOPClient/docs out/docs
          [ -f book-site.log ] && cp book-site.log out/
          cd out
          git init -q && git checkout -q -b results && git add -A
          git -c user.name=e2e -c user.email=e2e@users.noreply.github.com commit -qm "book site $GITHUB_RUN_ID"
          git push -q --force "https://x-access-token:${GITHUB_PAT}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/results/${GITHUB_RUN_ID}-book-site"
