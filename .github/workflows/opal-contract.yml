name: dsomop-2.10.4-opal-contract
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  opal:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        opal: ['6.1.3', '5.7.6']
        path: [fresh, upgrade]
    env:
      OPAL_VERSION: ${{ matrix.opal }}
      E2E_PATH: ${{ matrix.path }}
      MODE: candidate
      STACK: e2e
      OPAL_URL: http://localhost:8880
      OLD_REF: '2.10.1'
      OLD_CLIENT_REF: '2.10.1'
      CDM_DB: omop
      INSTALL_DRIVER: '1'
      SCENARIOS: O
      OUT: ${{ github.workspace }}/out
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
        id: checkout
      - name: Require a coordinated native-language candidate
        id: candidate
        run: |
          mkdir -p "$OUT"
          df -h .
          for v in OPAL_ADMIN_PW ANALYST_PW ANALYST2_PW OMOPDB_PW READER_PW; do
            p="Aa1@$(openssl rand -hex 16)"
            echo "::add-mask::$p"
            echo "$v=$p" >> "$GITHUB_ENV"
          done
          python3 scripts/o/check_candidate.py 2>&1 | tee -a "$OUT/$E2E_PATH-steps.log"
      - name: Pinned Opal and Rock
        id: stack
        run: bash scripts/o/stack.sh 2>&1 | tee -a "$OUT/$E2E_PATH-steps.log"
      - name: R (Posit build, main Ubuntu archive)
        uses: ./.github/actions/fast-r
        id: setup_r
        timeout-minutes: 10
      - name: Install client and fixture dependencies
        id: dependencies
        run: |
          Rscript scripts/install_r.R 2>&1 | tee -a "$OUT/$E2E_PATH-steps.log"
          Rscript -e 'install.packages(c("dsBaseClient", "RSQLite", "RPostgres", "testthat"))' 2>&1 | tee -a "$OUT/$E2E_PATH-steps.log"
      - name: Load GiBleed and create resources
        id: resources
        run: |
          bash scripts/omopdb.sh 2>&1 | tee -a "$OUT/$E2E_PATH-steps.log"
          Rscript scripts/admin_setup.R 2>&1 | tee -a "$OUT/$E2E_PATH-steps.log"
      - name: Copy administrator-only fixture scripts
        id: fixtures
        run: |
          docker cp pkgs/dsOMOP "$ROCK:/tmp/o-server-source" 2>&1 | tee -a "$OUT/$E2E_PATH-steps.log"
          docker cp scripts/o "$ROCK:/tmp/o-harness" 2>&1 | tee -a "$OUT/$E2E_PATH-steps.log"
      - name: Fresh or upgrade path; old-server negotiation before upgrade
        id: install
        run: Rscript scripts/o/install.R 2>&1 | tee -a "$OUT/$E2E_PATH-steps.log"
      - name: Export frozen reach fixtures and install runtime probes
        id: probes
        run: Rscript scripts/o/setup.R 2>&1 | tee -a "$OUT/$E2E_PATH-steps.log"
      - name: Scenarios O1 through O12
        id: scenarios
        run: Rscript scripts/o/run.R 2>&1 | tee -a "$OUT/$E2E_PATH-steps.log"
      - name: Old client against new server (O6)
        id: old_client
        if: always() && steps.probes.outcome == 'success'
        run: |
          Rscript -e 'remotes::install_github("isglobal-brge/dsOMOPClient", ref="2.10.1", lib="/tmp/o-old-client", upgrade="never")' 2>&1 | tee -a "$OUT/$E2E_PATH-steps.log"
          R_LIBS=/tmp/o-old-client Rscript scripts/o/old_client.R 2>&1 | tee -a "$OUT/$E2E_PATH-steps.log"
      - name: Runtime evidence and logs
        id: evidence
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 scripts/o/results.py
      - name: Results to a branch (including failed jobs)
        if: always() && steps.evidence.outcome == 'success'
        timeout-minutes: 5
        run: bash scripts/o/publish-results.sh
      - uses: actions/upload-artifact@v4
        if: always() && steps.evidence.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 4
        with:
          name: opal-${{ matrix.opal }}-${{ matrix.path }}
          path: out/
      - name: Remove disposable stack
        if: always()
        run: |
          docker rm -f omopdb || true
          docker compose -f compose/opal-matrix.yml down -v
