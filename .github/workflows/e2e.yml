# Real-Opal end-to-end check of dsOMOP / dsOMOPClient on an easy-opal stack (Opal + Rock + MongoDB behind nginx),
# with a PostgreSQL OMOP CDM (OHDSI Eunomia GiBleed, CDM 5.3) on the stack's network.
#   fresh   : a clean Opal; dsOMOP installed the way an admin does it (Opal > DataSHIELD > Packages > GitHub);
#             the analyst's script and the full method audit.
#   upgrade : dsOMOP <old_ref> first, then upgraded through the same install call, as APHRC's server was;
#             with a 1.x old_ref it reproduces "No such DataSHIELD 'ASSIGN' method with name: omopInitDS"; with a 2.x
#             old_ref (e.g. 2.10.2) the new client is also run against that real old server first (combo_old_server.R).
#   scenario G: the 2.10.3 checks that need a real Opal/Rock (scripts/scenario_G.R, scripts/scenario_G_old.R).
# mode=candidate installs dsOMOP / dsOMOPClient from pkgs/ (vendored sources) instead of GitHub refs.
# 2.10.3: gh workflow run e2e.yml -f mode=candidate -f old_ref=2.10.2 -f scenarios="C D E F G"
name: dsomop-opal-e2e
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "public (GitHub refs) or candidate (pkgs/ sources)"
        type: choice
        options: [public, candidate]
        default: public
      paths:
        description: "Paths to run (JSON list)"
        default: '["fresh", "upgrade"]'
      old_ref:
        description: "dsOMOP ref installed first on the upgrade path (2.10.2 = the release before 2.10.3; 1.1.1 = commit 6a22d259db95a3bfd264d029b653587f935e32db, as the ref '1.1.1' is both a branch and a tag)"
        default: "6a22d259db95a3bfd264d029b653587f935e32db"
      server_ref:
        description: "dsOMOP ref (public mode)"
        default: "2.10.0"
      client_ref:
        description: "dsOMOPClient ref (public mode)"
        default: "2.10.0"
      cdm_db:
        description: "CDM database behind the resources: omop (GiBleed as shipped, cdm_version v5.3.1) or omop53"
        default: "omop"
      scenarios:
        description: "Scenarios after the path (C D E F G; N numeric CDM requires 2.10.4)"
        default: "C D E F G"
      old_client_ref:
        description: "dsOMOPClient tag of the old client in scenario G (installed into its own library)"
        default: "2.10.2"
      big_persons:
        description: "Persons of the synthetic CDM of scenario G16 (fresh path; 0 = none)"
        default: "1000000"
      install_driver:
        description: "1 = install RPostgres through Opal; 0 = stock Rock image (RPostgreSQL only)"
        default: "0"
permissions:
  contents: write
jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJSON(inputs.paths) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    defaults:
      run:
        shell: bash
    env:
      MODE: ${{ inputs.mode }}
      E2E_PATH: ${{ matrix.path }}
      OLD_REF: ${{ inputs.old_ref }}
      SERVER_REF: ${{ inputs.server_ref }}
      CLIENT_REF: ${{ inputs.client_ref }}
      CDM_DB: ${{ inputs.cdm_db }}
      INSTALL_DRIVER: ${{ inputs.install_driver }}
      SCENARIOS: ${{ inputs.scenarios }}
      OLD_CLIENT_REF: ${{ inputs.old_client_ref }}
      BIG_PERSONS: ${{ matrix.path == 'fresh' && contains(inputs.scenarios, 'G') && inputs.big_persons || '0' }}
      STACK: e2e
      OPAL_URL: https://localhost:8443
      OUT: ${{ github.workspace }}/out
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Free disk, per-run passwords
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /usr/share/swift /usr/local/share/powershell /usr/share/miniconda /opt/az /opt/microsoft /opt/google
          df -h / | tail -1
          mkdir -p "$OUT"
          for v in OPAL_ADMIN_PW ANALYST_PW ANALYST2_PW OMOPDB_PW READER_PW; do
            p="Aa1@$(python3 -c 'import secrets,string; a=string.ascii_letters+string.digits; print("".join(secrets.choice(a) for _ in range(20)))')"
            echo "::add-mask::$p"; echo "$v=$p" >> "$GITHUB_ENV"
          done
      - name: easy-opal stack
        run: bash scripts/stack.sh 2>&1 | tee -a "$OUT/$E2E_PATH-steps.log"
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: R client packages
        run: Rscript scripts/install_r.R 2>&1 | tee -a "$OUT/$E2E_PATH-steps.log"
      - name: OMOP database (PostgreSQL + Eunomia GiBleed)
        run: bash scripts/omopdb.sh 2>&1 | tee -a "$OUT/$E2E_PATH-steps.log"
      - name: Numeric CDM (pinned Eunomia Synthea27Nj)
        run: bash scripts/numeric/load.sh 2>&1 | tee -a "$OUT/$E2E_PATH-steps.log"
      - name: Admin setup (analyst, project, resources)
        run: Rscript scripts/admin_setup.R 2>&1 | tee -a "$OUT/$E2E_PATH-steps.log"
      - name: Path ${{ matrix.path }}
        run: Rscript scripts/path_${{ matrix.path }}.R 2>&1 | tee -a "$OUT/$E2E_PATH-steps.log"
      - name: Scenario C (dsOMOP 1.x resources)
        if: always() && contains(inputs.scenarios, 'C')
        run: Rscript scripts/scenario_C.R 2>&1 | tee -a "$OUT/$E2E_PATH-steps.log"
      - name: Scenario D (method audit)
        if: always() && matrix.path == 'fresh' && contains(inputs.scenarios, 'D')
        timeout-minutes: 40
        run: Rscript scripts/scenario_D.R 2>&1 | tee -a "$OUT/$E2E_PATH-steps.log"
      - name: Scenario E (recipes)
        if: always() && matrix.path == 'fresh' && contains(inputs.scenarios, 'E')
        timeout-minutes: 30
        run: Rscript scripts/scenario_E.R 2>&1 | tee -a "$OUT/$E2E_PATH-steps.log"
      - name: Large synthetic CDM (scenario G16)
        if: always() && env.BIG_PERSONS != '0'
        timeout-minutes: 20
        run: bash scripts/omopbig.sh 2>&1 | tee -a "$OUT/$E2E_PATH-steps.log"
      - name: Scenario G (2.10.3 on a real Opal/Rock)
        if: always() && contains(inputs.scenarios, 'G')
        timeout-minutes: 80
        run: Rscript scripts/scenario_G.R 2>&1 | tee -a "$OUT/$E2E_PATH-steps.log"
      - name: Scenario G, old client (dsOMOPClient ${{ inputs.old_client_ref }} against this server)
        if: always() && contains(inputs.scenarios, 'G')
        timeout-minutes: 20
        run: Rscript scripts/scenario_G_old.R 2>&1 | tee -a "$OUT/$E2E_PATH-steps.log"
      - name: Scenario L (experiment, label characters and dsBase tables)
        if: always() && contains(inputs.scenarios, 'L')
        timeout-minutes: 20
        run: Rscript scripts/scenario_L.R 2>&1 | tee -a "$OUT/$E2E_PATH-steps.log"
      - name: Scenario N (numeric values and units)
        if: always() && contains(inputs.scenarios, 'N')
        timeout-minutes: 20
        run: Rscript scripts/scenario_N.R 2>&1 | tee -a "$OUT/$E2E_PATH-steps.log"
      # F removes RPostgres from Rock: it runs after G, which uses the standard driver.
      - name: Scenario F (RPostgreSQL fallback)
        if: always() && matrix.path == 'fresh' && contains(inputs.scenarios, 'F')
        timeout-minutes: 15
        run: Rscript scripts/scenario_F.R 2>&1 | tee -a "$OUT/$E2E_PATH-steps.log"
      - name: Summary
        if: always()
        run: |
          for f in "$OUT"/*summary*.txt; do [ -f "$f" ] && { echo "### $(basename "$f")"; echo '```'; cat "$f"; echo '```'; }; done >> "$GITHUB_STEP_SUMMARY"
          docker logs "$STACK-rock" > "$OUT/$E2E_PATH-rock.log" 2>&1 || true
          docker logs "$STACK-opal" > "$OUT/$E2E_PATH-opal.log" 2>&1 || true
          for c in opal rock; do docker exec "$STACK-$c" bash -c 'cd /srv/logs 2>/dev/null && tar -cz *.log' > "$OUT/$E2E_PATH-$c-srv-logs.tgz" 2>/dev/null || true; done
      - name: Results to a branch (the artifact and log services have failed before)
        if: always()
        run: |
          cd "$OUT"
          # Per-run passwords never reach git.
          for v in "$OPAL_ADMIN_PW" "$ANALYST_PW" "$ANALYST2_PW" "$OMOPDB_PW" "$READER_PW"; do { grep -rlF -- "$v" . || true; } | xargs -r sed -i "s/$v/***/g"; done
          git init -q && git checkout -q -b results && git add -A
          git -c user.name=e2e -c user.email=e2e@users.noreply.github.com commit -qm "e2e $GITHUB_RUN_ID $E2E_PATH $MODE"
          git push -q --force "https://x-access-token:${GITHUB_PAT}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/results/${GITHUB_RUN_ID}-${E2E_PATH}-${MODE}"
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        timeout-minutes: 4
        with:
          name: e2e-${{ matrix.path }}-${{ inputs.mode }}
          path: out/
